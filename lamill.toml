# lamill.toml — per-site config consumed by lamill (portfolio/ops) and rankmill (content/audits).
# [content] = stable identity, authored by hand. [todo] = volatile work state.
# rankmill output lives in sites/<domain>/rankmill-output/, not here.

schema = "lamill-toml-v1"

[deploy]
platform = "cf-pages"
production_branch = "main"
custom_domains = [
    "marginready.com",
]

[index]
indexnow_key = "494160881e1fdbf6c3af3f81d0af206c"
indexnow_enabled = true

[analytics]
ga4_id = "G-CMFN4W5RRG"

[stack]
framework = "astro"

[content]
# Declarative content identity for this site.
# Authored by the human; consumed by rankmill to generate drafts and run audits.
# Leave fields empty until you have a deliberate answer. Empty is better than wrong.
site_type = "tool"
primary_keyword = "TikTok Shop fee calculator"
secondary_keywords = [
    "tiktok shop fees explained",
    "how to calculate true margin",
    "tiktok shop payout schedule",
    "why tiktok shop payout is less than sales",
    "tiktok shop break-even calculator",
    "tiktok shop roas calculator",
    "how to calculate cogs tiktok shop",
]
icp = "A US-based TikTok Shop seller doing roughly $5k–$50k/month in sales across 10–80 SKUs, managing the business themselves, profitable enough to care about margins but too busy to reconcile fees and COGS manually in spreadsheets."
urgency_trigger = "Limited free beta access — discover real per‑SKU profit now instead of reconciling fees manually"
penalty = "Continue misjudging product profitability: wasted time, lower margins, and risking selling unprofitable SKUs"
tone = "practical, direct, data-driven"
law = ""                  # statute or regulation if applicable, else empty
